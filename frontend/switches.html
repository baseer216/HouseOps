<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0e17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HouseOPS - Switches</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-title" content="HouseOPS">
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js', { scope: '/' })
      .then(reg => console.log('SW registered:', reg.scope))
      .catch(err => console.log('SW registration failed:', err));
  });
}
</script>
<style>
:root{--bg:#0a0e17;--card:#111827;--border:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--accent:#3b82f6;--green:#22c55e;--red:#ef4444;--yellow:#eab308;--purple:#a855f7}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;min-height:100dvh;padding-bottom:env(safe-area-inset-bottom,20px);touch-action:manipulation}
.header{background:linear-gradient(135deg,#1e3a5f,#0a0e17);padding:max(env(safe-area-inset-top,10px),10px) clamp(12px,3vw,20px) 8px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.header a{text-decoration:none;color:inherit}
.header h1{font-size:clamp(1rem,3vw,1.3rem);font-weight:700}.header h1 span{color:var(--accent)}
.header .back{color:var(--accent);text-decoration:none;font-size:clamp(0.8rem,2vw,1rem)}
.container{padding:clamp(10px,2vw,16px)}
.switch-section{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:12px;padding:clamp(10px,2vw,16px)}
.switch-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.switch-header h2{font-size:clamp(0.9rem,2.5vw,1.1rem);font-weight:700}
.badge{padding:4px 10px;border-radius:6px;font-size:0.75rem;font-weight:600}
.badge.online{background:rgba(34,197,94,0.15);color:var(--green)}
.badge.offline{background:rgba(239,68,68,0.15);color:var(--red)}
.switch-meta{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px;font-size:clamp(0.7rem,1.8vw,0.8rem);color:var(--muted)}
.switch-meta span{display:flex;align-items:center;gap:4px}
.port-table{width:100%;border-collapse:collapse;font-size:clamp(0.65rem,1.6vw,0.8rem)}
.port-table th{text-align:left;color:var(--muted);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--border);font-size:0.6rem;text-transform:uppercase;white-space:nowrap;cursor:pointer;user-select:none}
.port-table th:hover{color:var(--accent)}
.port-table th .sort-arrow{margin-left:2px;font-size:0.5rem}
.port-table td{padding:8px 6px;border-bottom:1px solid var(--border);vertical-align:middle}
.port-table tr:last-child td{border-bottom:none}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%}
.status-dot.up{background:var(--green);box-shadow:0 0 4px var(--green)}
.status-dot.down{background:var(--muted)}
.speed-badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:0.6rem;font-weight:600}
.speed-10g{background:rgba(168,85,247,0.15);color:var(--purple)}
.speed-1g{background:rgba(59,130,246,0.15);color:var(--accent)}
.speed-100m{background:rgba(34,197,94,0.15);color:var(--green)}
.loading{text-align:center;padding:30px;color:var(--muted)}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.refresh-bar{display:flex;justify-content:space-between;align-items:center;padding:8px clamp(12px,3vw,20px);background:var(--card);border-bottom:1px solid var(--border);font-size:0.75rem;color:var(--muted)}
.refresh-bar button{padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:0.75rem;min-height:34px}
.refresh-bar button:active{background:var(--accent);color:#fff}
</style>
</head>
<body>
<div class="header"><a href="/"><h1><span>House</span>OPS - Switches</h1></a><a class="back" href="/">← Dashboard</a></div>
<div class="refresh-bar"><span id="lastUpdate">Loading...</span><button onclick="load()">↻ Refresh</button></div>
<div class="container" id="switchContainer"><div class="loading">Loading switch data...</div></div>
<script>
let firstLoad = true;
let refreshController = null;
const FETCH_TIMEOUT = 4000;
let portSort = {};

function fetchWithTimeout(url, timeout = FETCH_TIMEOUT) {
  const controller = new AbortController();
  const id = setTimeout(() => controller.abort(), timeout);
  return fetch(url, { signal: controller.signal }).then(r => { clearTimeout(id); return r.json(); }).catch(e => { clearTimeout(id); if (e.name === 'AbortError') return {}; throw e; });
}

function fmtSpeed(bps){if(!bps)return'-';if(bps>=1e10)return(bps/1e10).toFixed(0)+' Gbps';if(bps>=1e9)return(bps/1e9).toFixed(1)+' Gbps';if(bps>=1e6)return(bps/1e6).toFixed(0)+' Mbps';return bps+' bps'}
function speedClass(bps){if(bps>=1e10)return'speed-10g';if(bps>=1e9)return'speed-1g';if(bps>=1e8)return'speed-100m';return''}
function fmtOctets(bytes){if(!bytes)return'0 B';if(bytes<1024)return bytes+' B';if(bytes<1048576)return(bytes/1024).toFixed(1)+' KB';if(bytes<1073741824)return(bytes/1048576).toFixed(1)+' MB';return(bytes/1073741824).toFixed(2)+' GB'}

function sortPorts(ports, traffic, key, desc, swIp) {
  const combined = ports.map((p, i) => ({...p, traffic: traffic[i] || {}}));
  combined.sort((a, b) => {
    let va, vb;
    switch(key) {
      case 'port': va = a.port; vb = b.port; break;
      case 'name': va = a.name; vb = b.name; return desc ? vb.localeCompare(va) : va.localeCompare(vb);
      case 'status': va = a.status === 'up' ? 1 : 0; vb = b.status === 'up' ? 1 : 0; break;
      case 'speed': va = a.speed || 0; vb = b.speed || 0; break;
      case 'rx': va = a.traffic.in_octets || 0; vb = b.traffic.in_octets || 0; break;
      case 'tx': va = a.traffic.out_octets || 0; vb = b.traffic.out_octets || 0; break;
      case 'err': va = (a.traffic.in_errors||0)+(a.traffic.out_errors||0); vb = (b.traffic.in_errors||0)+(b.traffic.out_errors||0); break;
      default: va = a.port; vb = b.port;
    }
    return desc ? vb - va : va - vb;
  });
  return combined;
}

async function load(){
  if(refreshController) refreshController.abort();
  refreshController = new AbortController();
  try{
    const data=await fetchWithTimeout('/api/switches');
    document.getElementById('lastUpdate').textContent=new Date().toLocaleTimeString();

    if(firstLoad){
      let html='';
      data.switches.forEach(sw=>{
        const sc=sw.online?'online':'offline';const st=sw.online?'Online':'Offline';
        html+='<div class="switch-section" id="sw-'+sw.ip.replace(/\./g,'_')+'"><div class="switch-header"><h2>🔌 '+sw.name+'</h2><span class="badge '+sc+'" id="sw-status-'+sw.ip.replace(/\./g,'_')+'">'+st+'</span></div>';
        if(!sw.online){html+='<div style="color:var(--red);padding:10px 0" id="sw-error-'+sw.ip.replace(/\./g,'_')+'">'+(sw.error||'Unable to connect')+'</div></div>';return}
        html+='<div class="switch-meta"><span id="sw-ip-'+sw.ip.replace(/\./g,'_')+'">📍 '+sw.ip+'</span><span id="sw-model-'+sw.ip.replace(/\./g,'_')+'">📦 '+sw.model+'</span><span id="sw-uptime-'+sw.ip.replace(/\./g,'_')+'">⏱️ '+sw.uptime_days+' days</span><span id="sw-ports-'+sw.ip.replace(/\./g,'_')+'">🔌 '+sw.ports_up+'/'+sw.total_ports+' up</span></div>';
        if(sw.ports.length){
          const swKey = sw.ip.replace(/\./g,'_');
          if(!portSort[swKey]) portSort[swKey] = {k:'port',d:false};
          html+='<div class="table-scroll"><table class="port-table"><thead><tr>';
          html+='<th onclick="sortSwitchPorts(\''+swKey+'\')">Port<span class="sort-arrow" id="th-port-'+swKey+'"></span></th>';
          html+='<th onclick="sortSwitchPorts(\''+swKey+'\',\'name\')">Name<span class="sort-arrow" id="th-name-'+swKey+'"></span></th>';
          html+='<th onclick="sortSwitchPorts(\''+swKey+'\',\'status\')">Status<span class="sort-arrow" id="th-status-'+swKey+'"></span></th>';
          html+='<th onclick="sortSwitchPorts(\''+swKey+'\',\'speed\')">Speed<span class="sort-arrow" id="th-speed-'+swKey+'"></span></th>';
          html+='<th onclick="sortSwitchPorts(\''+swKey+'\',\'rx\')">RX<span class="sort-arrow" id="th-rx-'+swKey+'"></span></th>';
          html+='<th onclick="sortSwitchPorts(\''+swKey+'\',\'tx\')">TX<span class="sort-arrow" id="th-tx-'+swKey+'"></span></th>';
          html+='<th onclick="sortSwitchPorts(\''+swKey+'\',\'err\')">Err<span class="sort-arrow" id="th-err-'+swKey+'"></span></th>';
          html+='</tr></thead><tbody id="ports-body-'+swKey+'"></tbody></table></div>';
        }
        html+='</div>';
      });
      document.getElementById('switchContainer').innerHTML=html;
      window._switchData = data.switches;
      data.switches.forEach(sw => { if(sw.online) renderSwitchPorts(sw); });
      firstLoad=false;
    } else {
      // Smooth update
      window._switchData = data.switches;
      data.switches.forEach(sw=>{
        const id=sw.ip.replace(/\./g,'_');
        const statusEl=document.getElementById('sw-status-'+id);
        if(statusEl){
          const sc=sw.online?'online':'offline';const st=sw.online?'Online':'Offline';
          statusEl.className='badge '+sc;statusEl.textContent=st;
        }
        if(sw.online){
          const uptimeEl=document.getElementById('sw-uptime-'+id);
          if(uptimeEl)uptimeEl.textContent='⏱️ '+sw.uptime_days+' days';
          const portsEl=document.getElementById('sw-ports-'+id);
          if(portsEl)portsEl.textContent='🔌 '+sw.ports_up+'/'+sw.total_ports+' up';
          renderSwitchPorts(sw);
        } else {
          const errEl=document.getElementById('sw-error-'+id);
          if(errEl)errEl.textContent=sw.error||'Unable to connect';
        }
      });
    }
  }catch(e){
    if(e.name==='AbortError') return;
    if(firstLoad)document.getElementById('switchContainer').innerHTML='<div class="loading" style="color:var(--red)">Error: '+e.message+'</div>';
  }
}

function sortSwitchPorts(swKey, key) {
  if(!portSort[swKey]) portSort[swKey] = {k:'port',d:false};
  if(key) {
    if(portSort[swKey].k === key) portSort[swKey].d = !portSort[swKey].d;
    else { portSort[swKey].k = key; portSort[swKey].d = false; }
  }
  const sw = window._switchData ? window._switchData.find(s => s.ip.replace(/\./g,'_') === swKey) : null;
  if(sw && sw.online) renderSwitchPorts(sw);
}

function renderSwitchPorts(sw) {
  const swKey = sw.ip.replace(/\./g,'_');
  const sort = portSort[swKey] || {k:'port',d:false};
  const sorted = sortPorts(sw.ports, sw.traffic, sort.k, sort.d, sw.ip);
  const body = document.getElementById('ports-body-'+swKey);
  if(!body) return;
  let rows='';
  sorted.forEach(port=>{
    const t=port.traffic||{};
    const sd=port.status==='up'?'up':'down';
    const sl=port.speed>0?fmtSpeed(port.speed):'-';
    const scc=port.speed>0?speedClass(port.speed):'';
    const err=(t.in_errors||0)+(t.out_errors||0);
    const ec=err>0?'color:var(--yellow)':'';
    rows+='<tr><td><span class="status-dot '+sd+'"></span> '+port.port+'</td><td>'+port.name+'</td><td style="color:'+(port.status==='up'?'var(--green)':'var(--muted)')+'">'+port.status.toUpperCase()+'</td><td><span class="speed-badge '+scc+'">'+sl+'</span></td><td>'+fmtOctets(t.in_octets||0)+'</td><td>'+fmtOctets(t.out_octets||0)+'</td><td style="'+ec+'">'+err+'</td></tr>';
  });
  body.innerHTML=rows;
  ['port','name','status','speed','rx','tx','err'].forEach(k=>{
    const el=document.getElementById('th-'+k+'-'+swKey);
    if(el) el.textContent='';
  });
  const th=document.getElementById('th-'+sort.k+'-'+swKey);
  if(th) th.textContent=sort.d?' ▲':' ▼';
}

load();
setInterval(load,10000);
</script>
</body>
</html>
